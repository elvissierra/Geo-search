apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-name: {{ .Values.environment }}-{{ .Release.Name }}
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-scheme: {{ .Values.network.loadBalancer.schema }}
    service.beta.kubernetes.io/aws-load-balancer-type: nlb-ip
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: instance
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /api/health_check/cluster
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: traffic-port
    service.beta.kubernetes.io/aws-load-balancer-subnets: {{ .Values.network.loadBalancer.subnets }}
  labels:
    app: {{ .Release.Name }}
spec:
  ports:
  - name: {{ .Release.Name }}-listener
    port: {{ .Values.container.port }}
    targetPort: {{ .Values.container.targetPort }}
    protocol: TCP
  type: {{ .Values.network.type }}
  selector:
    app: {{ .Release.Name }} 
